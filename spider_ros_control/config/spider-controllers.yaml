controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    spider_controller:
      type: joint_trajectory_controller/JointTrajectoryController


spider_controller:
  ros__parameters:
    joints:
      - 1-1
      - 1-2
      - 1-3
      - 2-1
      - 2-2
      - 2-3
      - 3-1
      - 3-2
      - 3-3
      - 4-1
      - 4-2
      - 4-3
      - 5-1
      - 5-2
      - 5-3
      - 6-1
      - 6-2
      - 6-3

    command_interfaces:
      - position

    state_interfaces:
      - position      